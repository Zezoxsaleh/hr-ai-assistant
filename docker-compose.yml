services:
  postgres:
    image: postgres:16-alpine
    container_name: hr_ai_assistant_postgres
    environment:
      POSTGRES_DB: hr_ai_assistant
      POSTGRES_USER: hr_ai_assistant
      POSTGRES_PASSWORD: hr_ai_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_ai_assistant -d hr_ai_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
